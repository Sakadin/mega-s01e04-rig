name: Publish digest preview

# Never publish on push or pull_request. Clean replacement needs separate human
# approval after review; choosing clean alone is not that approval.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview banner mode (clean requires separate human approval)'
        type: choice
        options: [marked, clean]
        default: marked
        required: true
      clean_approved:
        description: 'I have separate human approval to replace the marked page with a clean page'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: digest-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write # Delete only this run's uploaded Pages artifact by ID.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require separate approval for clean replacement
        if: inputs.mode == 'clean' && !inputs.clean_approved
        run: |
          echo 'Clean replacement requires separate human approval and clean_approved=true.' >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: '12.23.0'
          run_install: false
          cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      - name: Prepare capture directory outside checkout
        run: mkdir -p "$RUNNER_TEMP/rig-preview"

      - name: Capture marked digest over loopback HTTP
        if: inputs.mode == 'marked'
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: pnpm capture:preview --mode marked --output "$RUNNER_TEMP/rig-preview/index.html"

      - name: Capture marker-free digest over loopback HTTP
        if: inputs.mode == 'clean'
        env:
          LANE_MARKER: ''
        run: pnpm capture:preview --mode clean --output "$RUNNER_TEMP/rig-preview/index.html"

      - uses: actions/configure-pages@v5

      - name: Upload temporary Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: rig-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1

      - name: Deploy to the replaceable public HTTPS URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: rig-preview-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete this exact temporary artifact after successful deployment
        if: success() && steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo 'Missing artifact ID' >&2; exit 1; }
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"

      - name: Remove local temporary capture and archive
        if: always()
        run: rm -f -- "$RUNNER_TEMP/rig-preview/index.html" "$RUNNER_TEMP/artifact.tar"
